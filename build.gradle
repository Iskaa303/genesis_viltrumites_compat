plugins {
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.137'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_name
}

legacyForge {
    version = forge_version

    validateAccessTransformers = true

    runs {
        client {
            client()
        }
        data {
            data()
        }
        server {
            server()
        }
    }

    mods {
        genesis_viltrumites {
            sourceSet sourceSets.main
        }
    }
}

mixin {
    add sourceSets.main, "mixins.genesis_viltrumites.refmap.json"
    config 'genesis_viltrumites.mixins.json'
}

jar {
    manifest.attributes([
            "MixinConfigs": "genesis_viltrumites.mixins.json"
    ])
}

repositories {
    flatDir { dir 'libs'}

    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "Valkyrien Skies Internal"
        url = 'https://maven.valkyrienskies.org'
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven { url = 'https://maven.blamejared.com/' }
    maven {
        name 'Curios maven'
        url = "https://maven.theillusivec4.top/"
    }
    maven { url = "https://maven.ithundxr.dev/mirror" }
    maven { url = "https://maven.bawnorton.com/releases" }
    maven { url = "https://maven.enjarai.dev/mirrors" }
    mavenCentral()
    maven { url = "https://www.cursemaven.com" }
}

dependencies {
    annotationProcessor("org.spongepowered:mixin:0.8.5:processor")

    // MixinExtras for compatibility
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    implementation("io.github.llamalad7:mixinextras-forge:0.5.0")

    // region Valkyrien Skies (needed for Genesis interop)
    implementation("org.valkyrienskies.core:api:${vs_core_version}") { transitive = false
        exclude group: 'org.joml', module: ''
    }
    implementation("org.valkyrienskies.core:internal:${vs_core_version}") { transitive = false
        exclude group: 'org.joml', module: ''
    }
    implementation("org.valkyrienskies.core:util:${vs_core_version}") { transitive = false
        exclude group: 'org.joml', module: ''
    }
    implementation("org.valkyrienskies.core:impl:${vs_core_version}") { transitive = false
        exclude group: 'org.joml', module: ''
    }
    modApi("org.valkyrienskies:valkyrienskies-120-forge:${vs2_version}") { transitive = false
        exclude group: 'org.valkyrienskies.core', module: ''
    }
    // endregion

    // region VS deps
    implementation "com.fasterxml.jackson.core:jackson-annotations:2.13.3"
    compileOnly("org.joml:joml:1.10.4")
    compileOnly("org.joml:joml-primitives:1.10.0")
    modApi("thedarkcolour:kotlinforforge:4.11.0")
    // endregion

    // VLib (required by Genesis)
    modImplementation("maven.modrinth:vlib:1.20.1-0.1.0+forge")
    modRuntimeOnly("maven.modrinth:architectury-api:9.2.14+forge")

    // Genesis transitive deps (Modrinth maven doesn't publish transitive info)
    modImplementation("maven.modrinth:lodestonelib:1.20.1-1.6.4.1")
    modImplementation("maven.modrinth:zps:1.20.1-2.0.0")
    modRuntimeOnly("maven.modrinth:zpl:1.20.1-1.5.0")
    modRuntimeOnly("maven.modrinth:spark:1.10.53-forge")
    modRuntimeOnly("maven.modrinth:fusion-connected-textures:1.2.12-forge-mc1.20.1")
    // Genesis mod — compile & runtime for mixin targets
    modImplementation("maven.modrinth:vs-genesis:1.20.1-0.7.3")

    // Viltrumite mod — runtime for testing
    modImplementation("curse.maven:viltrumite-flight-1528087:8411529")
    modImplementation("curse.maven:viltrumite-1553010:8430880")

    // Immersive Portals
    modImplementation("maven.modrinth:zf4Szzx2:Q6Z7eOLL")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}
