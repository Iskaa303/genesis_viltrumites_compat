# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx1G
loom.platform = forge

# Mod properties
mod_version = 0.0.1
maven_group = net.iskaa303
archives_name = genesis_viltrumites

# Minecraft properties
minecraft_version = 1.20.1

# Dependencies
forge_version = 1.20.1-47.4.0
vs2_version=2.4.10
vs_core_version=1.1.0+1d4a7373e9

# Makes MDG use parchment
neoForge.parchment.minecraftVersion=1.20.1
neoForge.parchment.mappingsVersion=2023.09.03

# Toolchain detection for NixOS - finds JDK 17 for Minecraft toolchain
org.gradle.java.installations.fromEnv=JAVA17_HOME
